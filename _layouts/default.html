<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <!--
      Overrides jekyll-theme-minimal's layout. Identical except that the
      theme's GitHub links ("View the Project on GitHub", "maintained by",
      the hosting credit) are removed — these pages are SwimHub's legal
      documents, not a code project.
    -->
    <div class="wrapper">
      <header>
        <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
      </header>
      <section>

      {{ content }}

      </section>
      <footer>
        <p>Questions? <a href="mailto:support@swimhub.fit">support@swimhub.fit</a></p>
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
